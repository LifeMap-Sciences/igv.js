name: Release Node Bundle

on:
  push:
    tags:
      - 'node-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Build Node bundle
        run: npm run build:node

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#node-v}" >> "$GITHUB_OUTPUT"

      - name: Prepare package.json for release
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' package.node.json > dist/package.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/igv-node.esm.js
            dist/package.json
